name: Build and Release Localcel (WinUI 3)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish WinUI 3 Standalone Single-File Executable
      run: |
        dotnet publish Localcel/Localcel.csproj -c Release -r win-x64 -o dist_single -p:WindowsPackageType=None -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

    - name: Publish WinUI 3 Unpackaged Folder
      run: |
        dotnet publish Localcel/Localcel.csproj -c Release -r win-x64 -o dist -p:WindowsPackageType=None

    - name: Prepare Release Artifacts
      run: |
        Move-Item dist_single\Localcel.exe Localcel.exe -Force
        Compress-Archive -Path dist\* -DestinationPath Localcel_v1.1_win-x64.zip -Force

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Localcel-Release-Files
        path: |
          Localcel.exe
          Localcel_v1.1_win-x64.zip
